name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # Single place to bump the Paperless release the plugin is verified against.
  PAPERLESS_IMAGE: ghcr.io/paperless-ngx/paperless-ngx:3.5.1

jobs:
  test:
    name: Unit tests and source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest openai

      - name: Fail on tab characters under site/
        run: |
          if grep -rlP '\t' site; then
            echo "::error::site/ must not contain tab characters"
            exit 1
          fi

      - name: Run unit tests
        run: PYTHONPATH=site pytest -q tests

  paperless:
    name: Verify against the Paperless image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check dist-info directory matches __version__
        run: |
          version=$(PYTHONPATH=site python3 -c 'import paperless_vlm_ocr; print(paperless_vlm_ocr.__version__)')
          dist=$(basename "$(ls -d site/paperless_vlm_ocr-*.dist-info)")
          test "$dist" = "paperless_vlm_ocr-${version}.dist-info"
          echo "dist-info directory matches version ${version}"

      - name: Check entry point and metadata in the Paperless image
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            -v "$PWD/site:/usr/src/paperless/vlm-ocr:ro" \
            -e PYTHONPATH=/usr/src/paperless/vlm-ocr \
            --entrypoint python3 "$PAPERLESS_IMAGE" -c '
          from importlib.metadata import entry_points, version

          import paperless_vlm_ocr

          eps = [e.value for e in entry_points(group="paperless_ngx.parsers")]
          assert eps == ["paperless_vlm_ocr.parser:VlmOcrParser"], eps
          dist_version = version("paperless-vlm-ocr")
          assert dist_version == paperless_vlm_ocr.__version__, dist_version
          print("entry point ok:", dist_version)
          '

      - name: Run unit tests inside the Paperless image when pytest is available
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            -v "$PWD/site:/usr/src/paperless/vlm-ocr:ro" \
            -v "$PWD/tests:/t:ro" \
            -e PYTHONPATH=/usr/src/paperless/vlm-ocr \
            --entrypoint sh "$PAPERLESS_IMAGE" -c '
          if python3 -c "import pytest" 2>/dev/null; then
            python3 -m pytest -q -p no:cacheprovider /t
          else
            echo "pytest is not installed in the Paperless image; skipping in-image tests"
          fi'

  image:
    name: Publish OCI image
    needs: [test, paperless]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Check git tag matches __version__
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(PYTHONPATH=site python3 -c 'import paperless_vlm_ocr; print(paperless_vlm_ocr.__version__)')
          test "$tag" = "$version"
          echo "tag ${tag} matches plugin version"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/anokfireball/paperless-vlm-ocr
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=false

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/anokfireball/paperless-vlm-ocr
