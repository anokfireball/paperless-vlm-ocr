name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest openai

      - name: Fail on tab characters under site/
        run: |
          if grep -rlP '\t' site; then
            echo "::error::site/ must not contain tab characters"
            exit 1
          fi

      - name: Check the three version places agree
        run: |
          version=$(PYTHONPATH=site python3 -c 'import paperless_vlm_ocr; print(paperless_vlm_ocr.__version__)')
          dist=$(basename "$(ls -d site/paperless_vlm_ocr-*.dist-info)")
          test "$dist" = "paperless_vlm_ocr-${version}.dist-info"
          test "$(sed -n 's/^Version: //p' "site/${dist}/METADATA")" = "$version"
          echo "dist-info directory and METADATA match version ${version}"

      - name: Run unit tests
        run: PYTHONPATH=site pytest -q tests

  paperless:
    name: Verify against the Paperless image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the verified Paperless version
        run: |
          version=$(PYTHONPATH=site python3 -c 'import paperless_vlm_ocr; print(paperless_vlm_ocr.VERIFIED_PAPERLESS)')
          echo "PAPERLESS_IMAGE=ghcr.io/paperless-ngx/paperless-ngx:${version}" >> "$GITHUB_ENV"
          echo "Verifying against Paperless ${version}"

      - name: Check supported version and entry point
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            -v "$PWD/site:/usr/src/paperless/vlm-ocr:ro" \
            -e PYTHONPATH=/usr/src/paperless/vlm-ocr \
            --entrypoint python3 "$PAPERLESS_IMAGE" -c '
          from importlib.metadata import entry_points, version

          from paperless.version import __version__ as running

          import paperless_vlm_ocr

          eps = [e.value for e in entry_points(group="paperless_ngx.parsers")]
          assert eps == ["paperless_vlm_ocr.parser:VlmOcrParser"], eps
          dist_version = version("paperless-vlm-ocr")
          assert dist_version == paperless_vlm_ocr.__version__, dist_version
          verified = tuple(
              int(part) for part in paperless_vlm_ocr.VERIFIED_PAPERLESS.split(".")
          )
          supported = sorted(paperless_vlm_ocr.SUPPORTED_PAPERLESS)
          assert verified[:2] in paperless_vlm_ocr.SUPPORTED_PAPERLESS, (
              paperless_vlm_ocr.VERIFIED_PAPERLESS,
              supported,
          )
          assert tuple(running[:2]) == verified[:2], (running, verified)
          print("entry point ok:", dist_version, "paperless", running, "supported", supported)
          '

      - name: Run unit tests inside the Paperless image when pytest is available
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            -v "$PWD/site:/usr/src/paperless/vlm-ocr:ro" \
            -v "$PWD/tests:/t:ro" \
            -e PYTHONPATH=/usr/src/paperless/vlm-ocr \
            --entrypoint sh "$PAPERLESS_IMAGE" -c '
          if python3 -c "import pytest" 2>/dev/null; then
            python3 -m pytest -q -p no:cacheprovider /t
          else
            echo "pytest is not installed in the Paperless image; skipping in-image tests"
          fi'

      - name: Smoke parse inside the Paperless image
        run: |
          docker run --rm \
            --tmpfs /tmp \
            --workdir /usr/src/paperless/src \
            -v "$PWD/site:/usr/src/paperless/vlm-ocr:ro" \
            -v "$PWD/tests:/t:ro" \
            -e PYTHONPATH=/usr/src/paperless/src:/usr/src/paperless/vlm-ocr \
            -e HOME=/tmp \
            -e PAPERLESS_SECRET_KEY=ci \
            -e PAPERLESS_DATA_DIR=/tmp/data \
            -e PAPERLESS_MEDIA_ROOT=/tmp/media \
            -e PAPERLESS_CONSUMPTION_DIR=/tmp/consume \
            -e PAPERLESS_OCR_LANGUAGE=eng \
            -e PAPERLESS_VLM_OCR_ENABLED=true \
            -e PAPERLESS_VLM_OCR_ENDPOINT=http://127.0.0.1:9/v1 \
            -e PAPERLESS_VLM_OCR_API_KEY=ci \
            -e PAPERLESS_VLM_OCR_MODEL=ci \
            -e PAPERLESS_VLM_OCR_TIMEOUT_S=5 \
            -e PAPERLESS_VLM_OCR_DECISION_LOG=/tmp/decisions.jsonl \
            --entrypoint sh "$PAPERLESS_IMAGE" -c '
          mkdir -p /tmp/data /tmp/media /tmp/consume &&
            python3 manage.py migrate --noinput &&
            python3 /t/smoke_parse.py'

  image:
    name: Publish image and release
    needs: [test, paperless]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Read version and look for its tag
        id: version
        run: |
          version=$(PYTHONPATH=site python3 -c 'import paperless_vlm_ocr; print(paperless_vlm_ocr.__version__)')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v${version}")" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tag v${version} already exists; nothing to publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "publishing ${version}"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.exists == 'false'

      - uses: docker/login-action@v4
        if: steps.version.outputs.exists == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.version.outputs.exists == 'false'
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/anokfireball/paperless-vlm-ocr:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/anokfireball/paperless-vlm-ocr

      - name: Create tag and GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --generate-notes
